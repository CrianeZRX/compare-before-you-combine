name: CPU checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: compare6d audit examples/synthetic_calls.json
      - run: compare6d replay data/paper_results.json --out build/results

  paper-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy scipy matplotlib
      - run: python paper/scripts/make_tables_v3.py
      - run: python paper/scripts/make_supp_tables_v3.py
      - run: python paper/scripts/make_s18_table.py
      - run: FIGW=7.1 python paper/scripts/make_figures_v3.py
      - run: git diff --exit-code paper/data33_17/derived_v3.json
      - run: python paper/scripts/check_numbers_v3.py
